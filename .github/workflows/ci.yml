name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Analyze, unit tests, README snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: dart run tool/check_readme_snippets.dart
      - run: dart pub publish --dry-run

  minimum-versions:
    name: Lowest supported Flutter and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.x
          channel: stable
      - run: flutter pub downgrade
      - run: flutter analyze lib test
      - run: flutter test

  web:
    name: Web tests (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test --platform chrome test/web

  android:
    name: Android build, JUnit and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: example
        run: flutter build apk --debug
      - working-directory: example/android
        run: ./gradlew :http_security_pinning:testDebugUnitTest :http_security_pinning:lintDebug

  ios:
    name: iOS build and XCTest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: example
        run: flutter build ios --simulator --debug
      # Serial testing on one simulator: parallel clones keep the assertion
      # messages out of the log and add minutes of clone launches.
      - working-directory: example/ios
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['name'] for k,v in d.items() if 'iOS' in k for x in v))")
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,name=$DEVICE" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/RunnerTests.xcresult"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xctest-results
          path: ${{ runner.temp }}/RunnerTests.xcresult
