name: http_security_pinning
description: >-
  SPKI SHA-256 certificate pinning for Flutter with a drop-in dart:io
  HttpClient, plus Ed25519 response signature checks on Flutter Web.
version: 2.0.0
repository: https://github.com/CaoGiaHieu-dev/http_security_pinning
issue_tracker: https://github.com/CaoGiaHieu-dev/http_security_pinning/issues
topics:
  - security
  - ssl-pinning
  - certificate-pinning
  - http
  - tls

environment:
  sdk: ">=3.5.0 <4.0.0"
  # Swift Package Manager support relies on the FlutterFramework package,
  # available since Flutter 3.41.
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  asn1lib: ^1.6.5
  crypto: ^3.0.6
  cryptography: ^2.9.0
  http: ^1.2.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.hieucg.http_security_pinning
        pluginClass: HttpSecurityPinningPlugin
      ios:
        pluginClass: HttpSecurityPinningPlugin
      macos:
        dartPluginClass: HttpSecurityPinningPlugin
      linux:
        dartPluginClass: HttpSecurityPinningPlugin
      windows:
        dartPluginClass: HttpSecurityPinningPlugin
      web:
        pluginClass: HttpSecurityPinningWeb
        fileName: src/web/web_plugin_registrar.dart

false_secrets:
  - /test/fixtures/*.key
  - /test/fixtures/*.p12
